name: Generation eval (manual)

# Manual only: each run makes ~70 Haiku calls (costs money + needs the ANTHROPIC_API_KEY secret),
# and the LLM-judge scores are noisy, so this is not a per-PR gate. Run it before a release or
# after a prompt/retrieval change to confirm faithfulness hasn't regressed.
on:
  workflow_dispatch:

jobs:
  generation-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruleslawyer
          POSTGRES_PASSWORD: ruleslawyer
          POSTGRES_DB: ruleslawyer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruleslawyer -d ruleslawyer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ruleslawyer:ruleslawyer@localhost:5432/ruleslawyer
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen
      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('scripts/fetch_corpus.py') }}
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Fetch corpus
        run: uv run python scripts/fetch_corpus.py
      - name: Apply schema
        run: uv run python scripts/apply_schema.py
      - name: Ingest corpus
        run: uv run python scripts/ingest.py
      - name: Generation eval gate (faithfulness)
        run: uv run python scripts/run_generation_eval.py --gate
