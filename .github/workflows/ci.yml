name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q

  retrieval-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruleslawyer
          POSTGRES_PASSWORD: ruleslawyer
          POSTGRES_DB: ruleslawyer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruleslawyer -d ruleslawyer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ruleslawyer:ruleslawyer@localhost:5432/ruleslawyer
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --frozen
      # corpus is version-pinned by commit + content hash, so this cache is safe to reuse
      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('scripts/fetch_corpus.py') }}
      # bge-small is ~130 MB; cache it so every run doesn't re-download from the HF hub
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Fetch corpus
        run: uv run python scripts/fetch_corpus.py
      - name: Apply schema
        run: uv run python scripts/apply_schema.py
      - name: Ingest corpus
        run: uv run python scripts/ingest.py
      - name: Retrieval eval gate (hybrid)
        run: uv run python scripts/run_retrieval_eval.py hybrid --gate
